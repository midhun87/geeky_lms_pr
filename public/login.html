<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geeky Researcher | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        theme: {
                            bg: '#c3ccf1',      // Soft periwinkle background
                            card: '#e8ebf7',    // Light grey/blue for cards
                            accent: '#4f46e5',  // Royal blue
                            primary: '#ea580c', // Bright orange
                            success: '#10b981'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #c3ccf1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .nav-btn { background-color: #4f46e5; transition: all 0.2s ease; }
        .nav-btn:hover { background-color: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }

        .form-card {
            background-color: #e8ebf7;
            border-radius: 2rem; /* Large rounded corners like reference */
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .premium-input {
            background-color: white;
            border: 1px solid transparent;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            outline: none;
            border-color: #ea580c;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
        }

        .btn-primary {
            background-color: #ea580c;
            color: white;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: #c2410c;
            box-shadow: 0 8px 20px -5px rgba(234, 88, 12, 0.4);
        }

        .btn-disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }
        
        /* View transitions */
        .view-section { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .view-section.active { display: block; opacity: 1; }

        .stat-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 2px dashed #94a3b8;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="antialiased text-slate-800">

    <nav class="w-full px-6 py-4 flex items-center justify-between z-50">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-8 h-8 bg-theme-accent rounded flex items-center justify-center text-white">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="font-bold text-xl leading-tight">
                <span class="text-xs block font-semibold text-theme-accent -mb-1 tracking-wider uppercase">Geeky</span>
                <span class="text-slate-900 tracking-tight">Researcher</span>
            </div>
        </div>

        <div class="hidden md:flex items-center gap-8 font-medium text-slate-700">
            <a href="index.html" class="hover:text-theme-accent transition">Home</a>
            <a href="login.html" class="text-theme-primary font-semibold">Login</a>
        </div>

        <div>
            <a href="register.html" class="nav-btn text-white px-6 py-2.5 rounded-lg font-semibold text-sm shadow-md">
                ENROLL NOW
            </a>
        </div>
    </nav>

    <main class="flex-1 flex w-full max-w-7xl mx-auto items-center justify-center lg:justify-between px-6 lg:px-12 py-8 relative">
        
        <!-- Left Side: Form Card -->
        <div class="w-full max-w-[420px] form-card p-8 sm:p-10 z-10 relative">
            
            <div class="mb-8">
                <div class="text-sm font-semibold text-theme-primary mb-1">Your logo</div>
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight" id="headerTitle">Login</h2>
                <p class="text-slate-500 mt-1 text-sm hidden" id="headerSub">Sign in to continue</p>
            </div>

            <!-- Global Alert Message -->
            <div id="alert-message" class="hidden mb-6 p-3 text-sm rounded-xl border text-center transition-all bg-white shadow-sm"></div>

            <!-- View 1: Login -->
            <div id="view-login" class="view-section active">
                
                <!-- Role Toggles (Subtle integration) -->
                <div class="flex gap-4 mb-6 border-b border-slate-300 pb-2">
                    <button id="tab-student" type="button" class="text-sm font-bold text-theme-primary border-b-2 border-theme-primary pb-1 transition" onclick="setRole('student')">Student</button>
                    <button id="tab-admin" type="button" class="text-sm font-semibold text-slate-500 hover:text-slate-800 pb-1 transition" onclick="setRole('admin')">Admin</button>
                </div>

                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">Email</label>
                        <input type="email" id="loginEmail" required class="premium-input w-full px-4 py-3 text-sm" placeholder="username@gmail.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">Password</label>
                        <input type="password" id="loginPassword" required class="premium-input w-full px-4 py-3 text-sm" placeholder="••••••••">
                    </div>
                    
                    <div class="flex justify-start">
                        <button type="button" onclick="switchView('view-forgot-email')" class="text-xs text-slate-500 hover:text-theme-primary font-medium transition">Forgot Password?</button>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-primary w-full py-3.5 rounded-xl font-bold text-[15px] mt-6 flex justify-center items-center gap-2 shadow-lg shadow-orange-500/20">
                        <span id="btnText">Sign in</span>
                        <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                    </button>
                </form>
                
                <p class="text-center text-sm text-slate-600 mt-8" id="register-link">
                    Don't have an account yet? <a href="register.html" class="text-slate-900 font-bold hover:underline">Register for free</a>
                </p>
            </div>
            
            <!-- View 4: Force Login -->
            <div id="view-force-login" class="view-section">
                <div class="text-center mb-6">
                    <div class="w-12 h-12 mx-auto bg-orange-100 rounded-full flex items-center justify-center mb-3 text-theme-primary">
                        <i class="fa-solid fa-laptop-medical text-xl"></i>
                    </div>
                    <p class="text-slate-600 text-sm mt-2">You are currently logged in on another device. End that session?</p>
                    <div class="mt-4 p-3 bg-white rounded-lg border border-slate-200 shadow-sm">
                        <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Active Device</span>
                        <span id="activeDeviceLabel" class="block text-slate-800 font-medium text-sm mt-0.5">Unknown</span>
                    </div>
                </div>
                
                <button type="button" onclick="handleLogin(event, true)" id="btnForceLogin" class="btn-primary w-full py-3 rounded-xl font-bold text-sm flex justify-center items-center gap-2 mb-3">
                    <span id="textForceLogin">Logout there & Login here</span>
                    <i id="spinForceLogin" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
                <button type="button" onclick="switchView('view-login')" class="w-full py-2.5 text-slate-500 hover:text-slate-800 text-sm font-semibold transition bg-white rounded-xl border border-slate-200">Cancel</button>
            </div>

            <!-- View 2: Forgot Password (Email step) -->
            <div id="view-forgot-email" class="view-section">
                <form onsubmit="handleSendResetOTP(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">Registered email</label>
                        <input type="email" id="resetEmail" required class="premium-input w-full px-4 py-3 text-sm" placeholder="email@institute.edu">
                        <p class="text-[11px] text-slate-500 mt-2 ml-1">We will send a 6-digit verification code.</p>
                    </div>
                    
                    <button type="submit" id="btnSendOTP" class="btn-primary w-full py-3 rounded-xl font-bold text-sm mt-2 flex justify-center items-center gap-2">
                        <span id="textSendOTP">Send Code</span>
                        <i id="spinSendOTP" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                    </button>
                    <button type="button" onclick="switchView('view-login')" class="w-full py-2.5 text-slate-500 hover:text-slate-800 text-sm font-semibold transition mt-2">Back to Login</button>
                </form>
            </div>

            <!-- View 3: Reset Password -->
            <div id="view-reset-password" class="view-section">
                <form onsubmit="handleResetPassword(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">6-Digit Code</label>
                        <input type="text" id="resetOTP" required pattern="[0-9]{6}" maxlength="6" class="premium-input w-full px-4 py-3 tracking-widest font-mono text-center text-lg bg-white" placeholder="123456">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">New Password</label>
                        <input type="password" id="newPassword" required minlength="6" class="premium-input w-full px-4 py-3 text-sm" placeholder="New strong password">
                    </div>
                    
                    <button type="submit" id="btnResetPass" class="bg-emerald-600 hover:bg-emerald-700 text-white w-full py-3 rounded-xl font-bold text-sm mt-4 flex justify-center items-center gap-2 transition">
                        <span id="textResetPass">Update Password</span>
                        <i id="spinResetPass" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                    </button>
                    <button type="button" onclick="switchView('view-login')" class="w-full py-2.5 text-slate-500 hover:text-slate-800 text-sm font-semibold transition mt-2">Cancel</button>
                </form>
            </div>
        </div>

        <div class="hidden lg:flex w-1/2 relative justify-center items-center h-[600px]">
            <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Happy Student" class="w-full h-full object-cover object-top mask-image-gradient rounded-3xl" style="-webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%); mask-image: linear-gradient(to bottom, black 70%, transparent 100%);">
            
            <!-- Floating Elements mimicking the reference -->
            <div class="stat-card absolute bottom-20 left-0 px-6 py-4 flex items-center gap-5 z-20">
                <div class="w-14 h-14 bg-theme-accent rounded-xl flex items-center justify-center text-white text-2xl shadow-inner">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div>
                    <div class="font-bold text-3xl text-slate-900 leading-none">250k</div>
                    <div class="text-sm font-medium text-slate-600 mt-1">Assisted Student</div>
                </div>
            </div>

            <div class="absolute top-1/3 -right-6 w-16 h-16 bg-theme-primary rounded-2xl shadow-lg shadow-orange-500/40 flex items-center justify-center text-white text-2xl z-20">
                <i class="fa-solid fa-chart-column"></i>
            </div>
        </div>

    </main>

    <script>
        const API_BASE_URL = '/api'; // Update for production
        let currentRole = 'student';

        // Check authentication status on load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const expiredError = urlParams.get('error');
            
            if (expiredError === 'session_conflict') {
                showAlert('You have been logged out because your account was accessed from another device.');
                localStorage.clear();
            } else {
                const token = localStorage.getItem('token');
                const role = localStorage.getItem('role');
                const userStr = localStorage.getItem('user');
                
                if (token && role && userStr) {
                    try {
                        const user = JSON.parse(userStr);
                        if (user && user.role === role) {
                            window.location.href = role === 'admin' ? '/admin/dashboard.html' : '/student/dashboard.html';
                        } else {
                            localStorage.clear();
                        }
                    } catch(e) {
                        localStorage.clear();
                    }
                } else if (token) {
                    localStorage.clear();
                }
            }
        });

        function getDeviceName() {
            const ua = navigator.userAgent;
            let browser = "Unknown Browser";
            let os = "Unknown OS";
            if (ua.includes("Firefox")) browser = "Firefox";
            else if (ua.includes("Edg")) browser = "Edge";
            else if (ua.includes("Chrome")) browser = "Chrome";
            else if (ua.includes("Safari")) browser = "Safari";
            if (ua.includes("Win")) os = "Windows";
            else if (ua.includes("Mac")) os = "MacOS";
            else if (ua.includes("Android")) os = "Android";
            else if (ua.includes("like Mac")) os = "iOS";
            else if (ua.includes("Linux")) os = "Linux";
            return `${os} - ${browser}`;
        }

        function showAlert(msg, type = 'error') {
            const el = document.getElementById('alert-message');
            el.innerHTML = msg;
            el.className = `mb-6 p-3 text-sm rounded-xl border text-center transition-all bg-white shadow-sm ${
                type === 'error' ? 'text-red-600 border-red-200' : 'text-emerald-600 border-emerald-200'
            }`;
            el.classList.remove('hidden');
        }

        function hideAlert() { document.getElementById('alert-message').classList.add('hidden'); }

        function switchView(viewId) {
            hideAlert();
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            const title = document.getElementById('headerTitle');
            
            if(viewId === 'view-login') title.innerText = 'Login';
            else if(viewId === 'view-forgot-email') title.innerText = 'Reset Password';
            else if(viewId === 'view-reset-password') title.innerText = 'New Password';
            else if (viewId === 'view-force-login') title.innerText = 'Session Active';
        }

        function setRole(role) {
            currentRole = role;
            const btnS = document.getElementById('tab-student');
            const btnA = document.getElementById('tab-admin');
            const emailInput = document.getElementById('loginEmail');
            const regLink = document.getElementById('register-link');
            
            hideAlert();

            if(role === 'student') {
                btnS.className = "text-sm font-bold text-theme-primary border-b-2 border-theme-primary pb-1 transition";
                btnA.className = "text-sm font-semibold text-slate-500 hover:text-slate-800 pb-1 transition border-b-2 border-transparent";
                emailInput.placeholder = "student@institute.edu";
                regLink.style.display = 'block';
            } else {
                btnA.className = "text-sm font-bold text-theme-primary border-b-2 border-theme-primary pb-1 transition";
                btnS.className = "text-sm font-semibold text-slate-500 hover:text-slate-800 pb-1 transition border-b-2 border-transparent";
                emailInput.placeholder = "admin@geeky.com";
                regLink.style.display = 'none';
            }
        }

        async function handleLogin(e, forceLogin = false) {
            if(e) e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const submitBtn = forceLogin ? document.getElementById('btnForceLogin') : document.getElementById('submitBtn');
            const btnText = forceLogin ? document.getElementById('textForceLogin') : document.getElementById('btnText');
            const btnSpinner = forceLogin ? document.getElementById('spinForceLogin') : document.getElementById('btnSpinner');
            
            const originalText = btnText.innerText;

            hideAlert();
            submitBtn.classList.add('btn-disabled');
            btnText.innerText = forceLogin ? 'Terminating & Signing in...' : 'Signing in...';
            btnSpinner.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email, password, role: currentRole, deviceName: getDeviceName(), forceLogin 
                    })
                });

                const data = await response.json();

                if (response.status === 409 && data.error === 'ACTIVE_SESSION') {
                    document.getElementById('activeDeviceLabel').innerText = data.activeDeviceName || 'Unknown Device';
                    switchView('view-force-login');
                    return; 
                }

                if (!response.ok) throw new Error(data.error || 'Login failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('role', data.user.role);

                window.location.href = data.user.role === 'admin' ? '/admin/dashboard.html' : '/student/dashboard.html';
            } catch (error) {
                if (error.message.includes('pending verification')) {
                    localStorage.setItem('pendingEmail', email);
                    window.location.href = 'payment-pending.html';
                } else {
                    showAlert(error.message);
                }
            } finally {
                submitBtn.classList.remove('btn-disabled');
                btnText.innerText = originalText;
                btnSpinner.classList.add('hidden');
            }
        }

        async function handleSendResetOTP(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const btn = document.getElementById('btnSendOTP');
            const txt = document.getElementById('textSendOTP');
            const spin = document.getElementById('spinSendOTP');

            hideAlert();
            btn.classList.add('btn-disabled');
            txt.innerText = 'Sending...';
            spin.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, type: 'reset' })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to send code');

                showAlert(data.message, 'success');
                setTimeout(() => switchView('view-reset-password'), 1500);
            } catch (error) {
                showAlert(error.message);
            } finally {
                btn.classList.remove('btn-disabled');
                txt.innerText = 'Send Code';
                spin.classList.add('hidden');
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value; 
            const otp = document.getElementById('resetOTP').value;
            const newPassword = document.getElementById('newPassword').value;
            
            const btn = document.getElementById('btnResetPass');
            const txt = document.getElementById('textResetPass');
            const spin = document.getElementById('spinResetPass');

            hideAlert();
            btn.classList.add('btn-disabled');
            txt.innerText = 'Updating...';
            spin.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to reset');

                showAlert('Password updated successfully! You can log in.', 'success');
                document.getElementById('loginEmail').value = email;
                setTimeout(() => { switchView('view-login'); }, 2500);
            } catch (error) {
                showAlert(error.message);
            } finally {
                btn.classList.remove('btn-disabled');
                txt.innerText = 'Update Password';
                spin.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
