    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Lora', 'serif']
                    }, 
                    colors: { 
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d', DEFAULT: '#10b981' }, 
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' } 
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'float': '0 10px 40px -10px rgba(0,0,0,0.12)',
                        'card': '0 2px 12px rgba(0,0,0,0.03)',

                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideInRight: { '0%': { transform: 'translateX(20px)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } }
                    }

        }

    <style>
        body { 
            background-color: #f8fafc; 
            color: #334155; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .panel { background-color: #ffffff; border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 1.5rem; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.02); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .tree-node { transition: all 0.2s ease; border-radius: 0.75rem; }
        .tree-node:active { transform: scale(0.98); }
        .tree-node:hover { background: #f8fafc; }
        .tree-node.active-node { background: #f0fdf4; color: #16a34a; font-weight: 600; border: 1px solid #bbf7d0; }

        /* THEME STYLES */
        .reader-paper { transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease; border-radius: 1.25rem; }
        .pdf-page-canvas, iframe, #main-video-player { transition: filter 0.4s ease; transform: translateZ(0); }
        .pdf-page-canvas { display: block; }
        
        .theme-light { background-color: #ffffff; color: #334155; border: 1px solid #e2e8f0; }
        .theme-light .pdf-page-canvas, .theme-light iframe { filter: none; }
        .video-theme-light { filter: none; }
        
        .theme-sepia { background-color: #FBF0D9; color: #5F4B32; border: 1px solid #EADAB8; }
        .theme-sepia .pdf-page-canvas, .theme-sepia iframe { filter: sepia(0.4) contrast(0.95) brightness(0.95); }
        .video-theme-sepia { filter: sepia(0.4) contrast(0.95) brightness(0.9); }
        
        .theme-sage { background-color: #E6EFE9; color: #2C4C3B; border: 1px solid #C4D9CD; }
        .theme-sage .pdf-page-canvas, .theme-sage iframe { filter: sepia(0.2) hue-rotate(90deg) contrast(0.95) brightness(0.95); }
        .video-theme-sage { filter: sepia(0.15) hue-rotate(15deg) brightness(0.9) contrast(0.9); }

        .theme-dark { background-color: #0f172a; color: #94a3b8; border: 1px solid #1e293b; }
        .theme-dark .pdf-page-canvas, .theme-dark iframe { filter: invert(0.92) hue-rotate(180deg) contrast(1.05) brightness(0.9); }
        .video-theme-dark { filter: brightness(0.7) contrast(1.05); }

        .theme-bluelight { background-color: #FFF3E0; color: #4E342E; border: 1px solid #FFE0B2; }
        .video-theme-bluelight { filter: sepia(0.5) hue-rotate(-15deg) contrast(0.95) brightness(0.85); }

        .theme-eink { background-color: #F5F5F5; color: #333333; border: 1px solid #E0E0E0; }
        .video-theme-eink { filter: grayscale(100%) contrast(1.1) brightness(0.9); }

        .theme-hcdark { background-color: #000000; color: #FFFF00; border: 1px solid #333333; }
        .video-theme-hcdark { filter: invert(0.9) grayscale(100%) contrast(1.5); }

        .speed-btn.active { background-color: #10b981; color: #ffffff; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3); }
        .video-container-wrapper { background: #000000; border-radius: 1rem; overflow: hidden; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.25); width: 100%; transition: all 0.4s ease; }

        body.expanded-mode header { display: none !important; }
        body.expanded-mode #syllabus-panel { display: none !important; }
        body.expanded-mode #workspace { padding: 0 !important; gap: 0 !important; }
        body.expanded-mode #reader-panel { border-radius: 0 !important; border: none !important; margin: 0 !important; max-width: 100%; height: 100vh; }
        body.expanded-mode #reader-viewport { padding-top: 4.5rem; padding-bottom: 2rem; max-width: 100%; }
        body.expanded-mode .video-container-wrapper { border-radius: 0; max-height: calc(100vh - 100px); height: calc(100vh - 100px); }
        body.expanded-mode #doc-ui { max-width: 100%; }
        body.expanded-mode #content-reader { max-width: 100%; border-radius: 0; min-height: 100vh; }

        @media (max-width: 1023px) {
            .mobile-hide { display: none !important; }
            .video-container-wrapper { border-radius: 0; box-shadow: none; border-bottom: 1px solid #334155; }
        }
    </style>
</head>

    <script>
        const API_BASE_URL = '/api';
        let allResources = [];
        let currentZoom = 1;

        document.addEventListener('DOMContentLoaded', () => {
            setTheme(localStorage.getItem('reader-theme') || 'light');
            fetchResources();
            initReadingProgress();
        });

        function showMobileReader() {
            if(window.innerWidth < 1024) {
                document.getElementById('syllabus-panel').classList.add('mobile-hide');
                document.getElementById('reader-panel').classList.remove('mobile-hide');
                window.scrollTo(0,0);
            }
        }
        function showMobileSyllabus() {
            if(window.innerWidth < 1024) {
                document.getElementById('syllabus-panel').classList.remove('mobile-hide');
                document.getElementById('reader-panel').classList.add('mobile-hide');
                const vid = document.getElementById('main-video-player'); if(vid && !document.pictureInPictureElement) vid.pause();
            }
        }
        window.addEventListener('resize', () => {
            if(window.innerWidth >= 1024) {
                document.getElementById('syllabus-panel').classList.remove('mobile-hide');
                document.getElementById('reader-panel').classList.remove('mobile-hide');
            }
        });

        function toggleThemeMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('theme-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden'); menu.style.opacity = 0; menu.style.transform = 'translateY(-10px) scale(0.95)';
                requestAnimationFrame(() => {
                    menu.style.transition = 'all 0.2s cubic-bezier(0.16, 1, 0.3, 1)'; menu.style.opacity = 1; menu.style.transform = 'translateY(0) scale(1)';
                });
            } else { menu.classList.add('hidden'); }
        }
        window.addEventListener('click', () => document.getElementById('theme-menu')?.classList.add('hidden'));

        function setTheme(themeName) {
            const paper = document.getElementById('content-reader');
            paper.className = `reader-paper w-full min-h-[85vh] h-full flex flex-col relative shadow-sm lg:shadow-card bg-white p-2 sm:p-4 lg:p-6 theme-${themeName}`;
            
            const video = document.getElementById('main-video-player');
            if(video) {
                video.className = `w-full h-full object-contain relative z-10 video-theme-${themeName}`;
            }
            localStorage.setItem('reader-theme', themeName);
        }

        function toggleFullScreen() {
            const body = document.body;
            body.classList.toggle('expanded-mode');
            
            const icon = document.getElementById('fullscreen-icon');
            const text = document.getElementById('fullscreen-text');
            
            if (body.classList.contains('expanded-mode')) {
                icon.className = 'fa-solid fa-compress text-brand-500'; 
                text.textContent = 'Collapse';
                try { 
                    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                    else if(document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
                } catch(e){}
            } else {
                icon.className = 'fa-solid fa-expand text-brand-500'; 
                text.textContent = 'Expand';
                try { 
                    if(document.exitFullscreen) document.exitFullscreen();
                    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
                } catch(e){}
            }
            
            setTimeout(() => window.dispatchEvent(new Event('resize')), 250);
        }

        async function fetchResources() {
            try {
                const res = await fetch(`${API_BASE_URL}/public/free-resources-tree`);
                if(!res.ok) throw new Error("Failed");
                allResources = await res.json();
                renderTree();
            } catch (e) { document.getElementById('tree-container').innerHTML = '<p class="text-red-500 text-center py-4 text-sm">Failed to load materials.</p>'; }
        }

        function renderTree() {
            const tree = document.getElementById('tree-container');
            let html = '';
            if(allResources.length === 0) { tree.innerHTML = '<p class="text-center text-slate-400 mt-4 text-sm">No materials available.</p>'; return; }

            allResources.forEach(folder => {
                html += `
                <div class="mb-1">
                    <div class="tree-node group flex items-stretch cursor-pointer border border-transparent">
                        <div onclick="toggleFolder(this); event.stopPropagation();" class="px-3 py-3 lg:py-2.5 text-surface-400 hover:text-surface-800 flex items-center justify-center w-10 lg:w-8">
                            <i class="fa-solid fa-chevron-down text-[13px] lg:text-[11px] transition-transform duration-200"></i>
                        </div>
                        <div onclick="toggleFolder(this.previousElementSibling); event.stopPropagation();" class="flex-1 pr-3 py-3 lg:py-2.5 text-[15px] lg:text-[14px] font-semibold text-surface-700 flex items-center group-hover:text-surface-900 transition-colors">
                            <i class="fa-solid fa-folder-closed text-brand-500/80 mr-3 text-lg lg:text-base"></i> 
                            <span class="truncate">${folder.name}</span>
                        </div>
                    </div>
                    <div class="tree-children hidden ml-[24px] lg:ml-[22px] border-l border-surface-200 pl-3 mt-1 space-y-1 lg:space-y-0.5">`;
                
                folder.items.forEach(file => {
                    const isVideo = file.type === 'video';
                    const icon = isVideo ? 'fa-circle-play text-purple-500' : 'fa-file-pdf text-red-500';
                    const iconBg = isVideo ? 'bg-purple-50 border-purple-100' : 'bg-red-50 border-red-100';

                    const fileData = encodeURIComponent(JSON.stringify(file));
                    html += `
                    <div onclick="viewContent('${fileData}', this)" class="tree-node cursor-pointer px-3 py-3 lg:py-2.5 text-[14px] lg:text-[13.5px] font-medium text-surface-600 flex items-center group transition-colors mt-0.5 border border-transparent">
                        <div class="w-8 h-8 lg:w-7 lg:h-7 rounded-lg border ${iconBg} flex items-center justify-center mr-3 shrink-0 shadow-sm transition-colors group-hover:bg-white">
                            <i class="fa-solid ${icon} text-[14px] lg:text-[13px]"></i>
                        </div>
                        <span class="truncate flex-1 group-hover:text-surface-900">${file.title}</span>
                    </div>`;
                });
                html += `</div></div>`;
            });
            tree.innerHTML = html;
        }

        function toggleFolder(iconElement) {
            const childrenContainer = iconElement.parentElement.nextElementSibling;
            childrenContainer.classList.toggle('hidden');
            iconElement.querySelector('i').classList.toggle('-rotate-90');
            const folderIcon = iconElement.parentElement.querySelector('.fa-folder-closed, .fa-folder-open');
            if(folderIcon) {
                folderIcon.classList.toggle('fa-folder-closed'); folderIcon.classList.toggle('fa-folder-open');
            }
        }

        function viewContent(encodedData, element) {
            document.querySelectorAll('.tree-node').forEach(el => el.classList.remove('active-node'));
            element.classList.add('active-node');

            const file = JSON.parse(decodeURIComponent(encodedData));
            document.getElementById('reader-breadcrumbs').innerText = file.title;
            document.getElementById('placeholder').style.display = 'none';
            
            const videoUI = document.getElementById('video-ui');
            const docUI = document.getElementById('doc-ui');
            const zoomControls = document.getElementById('zoom-controls');
            
            if (file.type === 'video') {
                docUI.classList.add('hidden');
                zoomControls.classList.add('hidden');
                videoUI.classList.remove('hidden');
                videoUI.classList.add('flex');
                
                const player = document.getElementById('main-video-player');
                player.src = file.url;
                player.play().catch(e => {});

            } else {
                videoUI.classList.add('hidden');
                videoUI.classList.remove('flex');
                docUI.classList.remove('hidden');
                docUI.classList.add('flex');
                zoomControls.classList.remove('hidden');
                
                currentZoom = window.innerWidth < 768 ? 1.0 : 1.25;
                document.getElementById('content-reader').style.zoom = currentZoom;
                document.getElementById('zoom-level-text').innerText = Math.round(currentZoom * 100) + '%';
                
                const urlLower = file.url.split('?')[0].toLowerCase();
                const isPPT = file.type === 'ppt' || urlLower.match(/\.(ppt|pptx)$/);

                if (isPPT) {
                    renderGooglePPT(file.url, 'content-reader');
                } else {
                    document.getElementById('content-reader').innerHTML = `
                        <div id="doc-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-surface-50 z-10">
                            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-500 mb-3"></i>
                            <span class="text-sm font-medium text-slate-500">Rendering document...</span>
                        </div>
                        <div id="pdf-viewer-container" class="w-full flex-1 p-0 overflow-y-auto relative z-0 hide-scrollbar flex flex-col items-center"></div>
                    `;
                    setTimeout(() => loadSecurePDF(file.url, 'pdf-viewer-container'), 100);
                }
            }
            showMobileReader();
            document.getElementById('reader-viewport').scrollTop = 0;
        }

        async function loadSecurePDF(url, containerId) {
            const container = document.getElementById(containerId);
            const loader = document.getElementById('doc-loader');
            try {
                const pdf = await pdfjsLib.getDocument(url).promise;
                loader.style.display = 'none'; 
                
                /* PERFORMANCE & QUALITY UPGRADE: 
                   Force a high internal rendering density (minimum 2.5x).
                   This draws the PDF huge in memory, then CSS squishes it to fit the screen, 
                   resulting in ultra-crisp "retina" quality text without jagged edges. */
                const pixelRatio = Math.max(window.devicePixelRatio || 1, 2.5); 
                
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    let containerWidth = container.clientWidth;
                    if(containerWidth === 0) containerWidth = window.innerWidth > 1024 ? window.innerWidth - 400 : window.innerWidth - 32;
                    
                    const unscaledViewport = page.getViewport({ scale: 1.0 });
                    
                    // Display Scale: How big it physically sits on the screen
                    const displayScale = (containerWidth - 20) / unscaledViewport.width; 
                    const displayViewport = page.getViewport({ scale: displayScale });

                    // Render Scale: How many pixels are actually drawn in the canvas engine
                    const renderViewport = page.getViewport({ scale: displayScale * pixelRatio });

                    const wrapper = document.createElement('div');
                    wrapper.className = 'relative mb-6 mx-auto shadow-md bg-white overflow-hidden';
                    wrapper.style.width = Math.floor(displayViewport.width) + 'px';
                    wrapper.style.height = Math.floor(displayViewport.height) + 'px';

                    const canvas = document.createElement('canvas');
                    
                    // Give canvas massive internal dimensions for high-res text
                    canvas.width = Math.floor(renderViewport.width);
                    canvas.height = Math.floor(renderViewport.height);
                    
                    // Constrain it via CSS to fit perfectly inside the wrapper
                    canvas.style.width = Math.floor(displayViewport.width) + 'px';
                    canvas.style.height = Math.floor(displayViewport.height) + 'px';
                    canvas.className = 'absolute inset-0 w-full h-full pdf-page-canvas block';

                    wrapper.appendChild(canvas); 
                    container.appendChild(wrapper);
                    
                    const renderContext = {
                        canvasContext: canvas.getContext('2d'),
                        viewport: renderViewport
                    };
                    await page.render(renderContext).promise;
                }
            } catch (err) {
                loader.style.display = 'none';
                container.innerHTML = `<div class="bg-rose-50 border border-rose-200 p-4 rounded text-center w-full max-w-md mt-10"><p class="text-rose-600 font-bold mb-1"><i class="fa-solid fa-triangle-exclamation"></i> Document Engine Error</p><p class="text-xs text-rose-500">CORS restriction or invalid format.</p></div>`;
            }
        }

        function renderGooglePPT(url, containerId) {
            const container = document.getElementById(containerId);
            const embedUrl = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`;
            
            container.innerHTML = `
                <div class="w-full h-full min-h-[85vh] relative flex flex-col rounded-xl overflow-hidden border border-surface-200 shadow-inner bg-slate-50">
                    <div class="p-3 bg-white border-b border-surface-200 flex justify-between items-center shrink-0">
                        <span class="font-bold text-surface-800 text-[13px] flex items-center">
                            <i class="fa-solid fa-file-powerpoint text-brand-600 mr-2"></i> Document Viewer
                        </span>
                    </div>
                    
                    <div class="flex-1 w-full relative">
                        <div class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 z-0">
                            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-brand-500 mb-4"></i>
                            <span class="text-sm font-bold text-slate-700">Loading document...</span>
                        </div>
                        <iframe src="${embedUrl}" class="w-full h-full absolute inset-0 border-none z-10" allowfullscreen></iframe>
                    </div>
                </div>
            `;
        }

        function changeZoom(delta) {
            currentZoom += delta;
            if (currentZoom < 0.5) currentZoom = 0.5; if (currentZoom > 3.0) currentZoom = 3.0;
            document.getElementById('content-reader').style.zoom = currentZoom;
            document.getElementById('zoom-level-text').innerText = Math.round(currentZoom * 100) + '%';
        }

        function setSpeed(speed, btnElement) {
            document.getElementById('main-video-player').playbackRate = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-brand-500', 'text-white'); btn.classList.add('text-surface-600');
            });
            btnElement.classList.remove('text-surface-600'); btnElement.classList.add('active', 'bg-brand-500', 'text-white');
        }
        function skipVideo(seconds) {
            const player = document.getElementById('main-video-player');
            if (player) player.currentTime += seconds;
        }
        async function togglePip() {
            const player = document.getElementById('main-video-player');
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else if (document.pictureInPictureEnabled) await player.requestPictureInPicture();
            } catch (err) {}
        }

        function initReadingProgress() {
            const viewport = document.getElementById('reader-viewport');
            const progressBar = document.getElementById('reading-progress');
            viewport.addEventListener('scroll', () => {
                const scrollTop = viewport.scrollTop;
                const scrollHeight = viewport.scrollHeight - viewport.clientHeight;
                if (scrollHeight <= 0) { progressBar.style.width = '100%'; return; }
                progressBar.style.width = ((scrollTop / scrollHeight) * 100) + '%';
            });
        }
    </script>
</body>
</html>
